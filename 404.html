<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found — exploreain</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/app-icon.png">
<link rel="apple-touch-icon" href="/assets/app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;900&display=swap">
<style>
  :root{color-scheme:dark;--bg:#0a0f1a;--ink:#f5f8fa;--dim:#9aa5b1;
        --accent:#2563eb;--accent-2:#38bdf8;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg) url("/assets/pattern.webp") repeat;background-size:560px;
    color:var(--ink);font-family:"Nunito",ui-sans-serif,system-ui,sans-serif;
    display:grid;place-items:center;text-align:center;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  .box{
    background:rgba(10,15,26,.78);border-radius:20px;padding:44px 32px;
    max-width:460px;display:flex;flex-direction:column;align-items:center;gap:16px;
  }
  .brand{display:inline-flex;align-items:center;gap:10px}
  .brand-icon{height:42px;width:42px;object-fit:cover;border-radius:10px}
  .brand-wordmark{height:30px;width:auto}
  h1{margin:0;font-weight:900;font-size:clamp(1.8rem,1.3rem+2vw,2.6rem);letter-spacing:-.03em;line-height:1.1}
  p{margin:0;color:var(--dim);max-width:34ch}
  a.btn{
    margin-top:8px;display:inline-block;text-decoration:none;font-weight:900;
    padding:13px 26px;border-radius:999px;color:#04070f;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }
</style>
</head>
<body>
  <div class="box">
    <span class="brand"><img class="brand-icon" src="/assets/app-icon.png" alt=""><img class="brand-wordmark" src="/assets/logo.webp" alt="exploreain"></span>
    <h1>Nothing here.</h1>
    <p>This one isn't on the map. The hidden gems are in the app, not on this address.</p>
    <a class="btn" href="/">Back to the start</a>
  </div>
</body>
</html>
